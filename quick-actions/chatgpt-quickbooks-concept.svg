<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Concept mockup of a ChatGPT estimate workflow</title>
  <desc id="desc">Fictional sample of ChatGPT using Gmail, QuickBooks, and saved pricing notes to prepare an estimate for owner review.</desc>
  <rect width="1440" height="900" fill="#fff"/>
  <rect width="236" height="900" fill="#f8f8f7"/>
  <path d="M236 0v900" stroke="#e7e8e8"/>
  <text x="28" y="46" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#202123">ChatGPT</text>
  <rect x="19" y="76" width="198" height="38" rx="10" fill="#fff" stroke="#e1e3e4"/>
  <text x="37" y="101" font-family="Arial,sans-serif" font-size="14" fill="#31343a">＋  New chat</text>
  <text x="25" y="155" font-family="Arial,sans-serif" font-size="12" fill="#8b8c8e">Recent</text>
  <text x="31" y="190" font-family="Arial,sans-serif" font-size="13" fill="#35373a">Create an estimate</text>
  <text x="31" y="225" font-family="Arial,sans-serif" font-size="13" fill="#737578">Prepare a customer reply</text>
  <g transform="translate(80 0)">
  <rect x="255" y="18" width="1155" height="54" rx="12" fill="#fff"/>
  <text x="279" y="52" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#25282c">ChatGPT  ⌄</text>
  <rect x="1183" y="27" width="202" height="34" rx="17" fill="#f5f5f4"/>
  <text x="1210" y="49" font-family="Arial,sans-serif" font-size="12" fill="#6b6e72">CONCEPT UI · SAMPLE DATA</text>

  <rect x="523" y="112" width="665" height="83" rx="18" fill="#f3f4f4"/>
  <text x="548" y="145" font-family="Arial,sans-serif" font-size="16" fill="#242629">Find the new quote request email with subject “Estimate Form.”</text>
  <text x="548" y="172" font-family="Arial,sans-serif" font-size="16" fill="#242629">Check my saved pricing and prepare a QuickBooks estimate.</text>

  <g font-family="Arial,sans-serif">
    <circle cx="536" cy="238" r="10" fill="#132d25"/>
    <path d="M532 238h8m-4-4 4 4-4 4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="558" y="243" font-size="14" fill="#777b80">Checking saved pricing notes before preparing the estimate</text>
    <text x="1103" y="243" font-size="14" fill="#777b80">›</text>
    <text x="523" y="281" font-size="13" fill="#85898e">Used connected tools</text>
    <rect x="523" y="294" width="116" height="29" rx="14" fill="#f8f8f7" stroke="#e6e8e9"/>
    <text x="548" y="313" font-size="12" fill="#555c63">QuickBooks</text>
    <rect x="648" y="294" width="72" height="29" rx="14" fill="#f8f8f7" stroke="#e6e8e9"/>
    <text x="670" y="313" font-size="12" fill="#555c63">Gmail</text>
    <rect x="729" y="294" width="155" height="29" rx="14" fill="#f8f8f7" stroke="#e6e8e9"/>
    <text x="748" y="313" font-size="12" fill="#555c63">Saved pricing notes</text>
  </g>

  <rect x="523" y="340" width="665" height="327" rx="16" fill="#fff" stroke="#e4e7e8"/>
  <path d="M524 396h663" stroke="#eceeef"/>
  <circle cx="552" cy="368" r="11" fill="#2ca01c"/>
  <text x="545" y="372" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#fff">qb</text>
  <text x="572" y="373" font-family="Arial,sans-serif" font-size="14" fill="#6b7075">Intuit QuickBooks</text>
  <rect x="1082" y="356" width="82" height="22" rx="11" fill="#edf3ef"/>
  <text x="1101" y="371" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing=".5" fill="#55715f">SAMPLE</text>

  <text x="548" y="433" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1e2226">Taylor Brooks</text>
  <text x="548" y="459" font-family="Arial,sans-serif" font-size="15" fill="#5f646a">taylor@example.com</text>
  <text x="1034" y="430" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#25292d">Estimate 2048</text>
  <text x="1034" y="458" font-family="Arial,sans-serif" font-size="14" fill="#62676d">Expires Nov 27, 2026</text>
  <path d="M547 482h617" stroke="#dfe2e4"/>
  <text x="548" y="514" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#62686e">PRODUCT / SERVICE</text>
  <text x="1134" y="514" text-anchor="end" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#62686e">AMOUNT</text>
  <text x="548" y="546" font-family="Arial,sans-serif" font-size="16" fill="#2e3338">Commercial cleaning</text>
  <text x="548" y="568" font-family="Arial,sans-serif" font-size="12" fill="#7a8188">2,000 sq ft × $0.15 per sq ft</text>
  <text x="1134" y="546" text-anchor="end" font-family="Arial,sans-serif" font-size="16" fill="#2e3338">$300.00</text>
  <path d="M547 583h617" stroke="#dfe2e4"/>
  <text x="1058" y="615" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#30353a">TOTAL</text>
  <text x="1134" y="615" text-anchor="end" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#30353a">$300.00</text>
  <rect x="548" y="632" width="239" height="24" rx="12" fill="#fff4e6"/>
  <text x="561" y="648" font-family="Arial,sans-serif" font-size="11" fill="#865b2e">Review possible customer match before sending</text>

  <text x="523" y="708" font-family="Arial,sans-serif" font-size="14" fill="#424950">I used the saved commercial-cleaning rate. I found a possible customer match by name only,</text>
  <text x="523" y="732" font-family="Arial,sans-serif" font-size="14" fill="#424950">so please verify the contact before sending this estimate.</text>
  <rect x="523" y="764" width="665" height="74" rx="17" fill="#fff" stroke="#d9dddf"/>
  <text x="549" y="795" font-family="Arial,sans-serif" font-size="14" fill="#858a90">Review the customer and estimate before sending…</text>
  <circle cx="1151" cy="801" r="20" fill="#155e4b"/>
  <path d="M1151 810v-17m-7 7 7-7 7 7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="523" y="874" font-family="Arial,sans-serif" font-size="11" fill="#92969a">Fictional sample. The owner reviews and chooses whether to send.</text>
  </g>
</svg>
